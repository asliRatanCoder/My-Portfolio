<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="SpeakWise AI English coach chat">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient></defs>
  <rect width="640" height="400" fill="url(#g)"/>
  <rect x="180" y="24" width="280" height="376" rx="28" fill="#1e293b"/>
  <rect x="192" y="36" width="256" height="352" rx="20" fill="#f8fafc"/>
  <rect x="192" y="36" width="256" height="52" rx="20" fill="#1d4ed8"/>
  <rect x="192" y="70" width="256" height="18" fill="#1d4ed8"/>
  <text x="212" y="66" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">SpeakWise coach</text>
  <text x="212" y="80" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="9">Fluency today: 78 / 100</text>
  <g font-family="Inter,Arial,sans-serif" font-size="10.5">
    <rect x="290" y="102" width="146" height="40" rx="10" fill="#1d4ed8"/>
    <text x="300" y="118" fill="#fff">Yesterday I go to market</text>
    <text x="300" y="133" fill="#fff">and buyed vegetables.</text>
    <rect x="204" y="152" width="214" height="118" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="214" y="170" fill="#0f172a" font-weight="700">Nice! Two small fixes:</text>
    <rect x="214" y="180" width="34" height="14" rx="4" fill="#fee2e2"/>
    <text x="218" y="190" fill="#b91c1c">go</text>
    <text x="252" y="190" fill="#0f172a">→ went (past tense)</text>
    <rect x="214" y="200" width="48" height="14" rx="4" fill="#fee2e2"/>
    <text x="218" y="210" fill="#b91c1c">buyed</text>
    <text x="266" y="210" fill="#0f172a">→ bought (irregular)</text>
    <text x="214" y="232" fill="#334155" font-style="italic">"Yesterday I went to the market</text>
    <text x="214" y="246" fill="#334155" font-style="italic">and bought vegetables."</text>
    <text x="214" y="262" fill="#16a34a" font-weight="700">What did you cook with them?</text>
    <rect x="204" y="330" width="232" height="34" rx="17" fill="#fff" stroke="#cbd5e1"/>
    <text x="220" y="351" fill="#94a3b8">Type or hold to speak…</text>
    <circle cx="420" cy="347" r="11" fill="#1d4ed8"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" fill="#1e3a8a">
    <text x="28" y="60" font-size="14" font-weight="800">Chat or speak</text>
    <text x="28" y="80" font-size="11" fill="#334155">everyday English</text>
    <text x="28" y="130" font-size="14" font-weight="800">Every mistake</text>
    <text x="28" y="150" font-size="11" fill="#334155">marked and explained</text>
    <text x="28" y="200" font-size="14" font-weight="800">Fluency score</text>
    <text x="28" y="220" font-size="11" fill="#334155">tracked per session</text>
    <text x="490" y="60" font-size="14" font-weight="800">Flutter</text>
    <text x="490" y="80" font-size="11" fill="#334155">Android app</text>
    <text x="490" y="130" font-size="14" font-weight="800">FastAPI</text>
    <text x="490" y="150" font-size="11" fill="#334155">coach backend</text>
    <text x="490" y="200" font-size="14" font-weight="800">Free LLM tier</text>
    <text x="490" y="220" font-size="11" fill="#334155">no billing needed</text>
  </g>
</svg>
